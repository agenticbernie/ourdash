[project]
name = "ourdash"
version = "0.1.0"
description = "Modern Python SDK for Dash (Dash Core + Dash Platform) — RPC, wallet/tx, P2P/network, DAPI/Drive"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ourdash contributors" }]
keywords = ["dash", "dash-core", "dash-platform", "dapi", "drive", "crypto", "sdk"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "requests>=2.31",
  "pydantic>=2.0",
  "base58>=2.1",
  "bech32>=1.2",
  "ecdsa>=0.18",
  "mnemonic>=0.20",
]

[project.optional-dependencies]
platform = [
  "grpcio>=1.60",
  "protobuf>=4.25",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "black>=24.0",
  "mypy>=1.10",
  "types-requests",
]
all = [
  "ourdash[platform,dev]",
]

[project.urls]
Homepage = "https://dash.org"
Documentation = "https://docs.dash.org"
Source = "https://github.com/agenticbernie/ourdash"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ourdash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "hybrid: needs regtest dashd or recorded fixtures",
  "agent_probe: live testnet, never run in CI",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
